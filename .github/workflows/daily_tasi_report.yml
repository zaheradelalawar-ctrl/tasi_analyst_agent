name: Daily TASI Institutional Consensus Report

on:
  schedule:
    # Runs at 3:30 UTC (06:30 AM Riyadh time / AST) Sunday through Thursday
    - cron: '30 3 * * 0-4'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TASI Analyst Agent
        run: python main.py

      - name: Send Excel Report via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "TASI Daily Institutional Consensus Report - ${{ github.run_id }}"
          to: zaheradelalawar@gmail.com
          from: "TASI Analyst Agent <${{ secrets.MAIL_USERNAME }}>"
          body: "Attached is your automated daily TASI institutional consensus Excel report."
          attachments: "*.xlsx"